<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Next Up{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Next Up</a>
    <nav>
      <a href="/" {% if page == 'browse' %}aria-current="page"{% endif %}>Browse</a>
      <a href="/recommendations" {% if page == 'recs' %}aria-current="page"{% endif %}>For you</a>
      <a href="/rated" {% if page == 'rated' %}aria-current="page"{% endif %}>My ratings</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
