<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CineVibe{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='logo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="{{ url_for('static', path='logo.svg') }}" alt="" width="36" height="36">
      CineVibe
    </a>
    <nav>
      <a href="/" {% if page == 'browse' %}aria-current="page"{% endif %}>Browse</a>
      <a href="/recommendations" {% if page == 'recs' %}aria-current="page"{% endif %}>For you</a>
      <a href="/watchlist" {% if page == 'watchlist' %}aria-current="page"{% endif %}>Watchlist</a>
      <a href="/rated" {% if page == 'rated' %}aria-current="page"{% endif %}>My ratings</a>
      <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var root = document.documentElement;
      function label() {
        btn.textContent = root.getAttribute('data-theme') === 'dark' ? 'Light mode' : 'Dark mode';
      }
      label();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        label();
      });
    })();
  </script>
</body>
</html>
